[package]
name = "deskagent-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "DeskAgent manager: client registry, job dispatch, AI chat proxy and admin console"

# Standalone crate: the empty [workspace] detaches it from the rustdesk
# workspace rooted at ../Cargo.toml (whose members only list libs/*, so a
# crate nested here would otherwise be rejected at build time).
[workspace]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Outbound LLM calls (OpenAI-compatible). Not in the original dep list;
# added per plan risk #4 because the AI proxy needs an HTTP client.
ureq = { version = "2.9", features = ["json"] }
