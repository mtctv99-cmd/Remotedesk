[package]
name = "deskagent-control-plane"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "DeskAgent owned control plane: v2 signaling (deskagent-sig/2), blind relay (deskagent-relay/2) and enrollment/key-ceremony API. Shares the manager SQLite DB and auth scheme."

# Standalone crate: the empty [workspace] detaches it from the parent
# workspace rooted at ../Cargo.toml (same pattern as manager/).
[workspace]

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.44.2", features = ["full"] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ring = "=0.17.14"
base64 = "=0.22.1"

[dev-dependencies]
# Router::oneshot for handler tests (same as manager/).
tower = { version = "=0.4.13", features = ["util"] }
