# ================================================================
# DeskAgent - docker-compose cho server đầy đủ
#
# Bản này dùng port mapping — chạy được trên CẢ Windows (Docker Desktop)
# lẫn Linux VPS.
#
# Chạy:      docker compose up -d
# Xem log:   docker compose logs -f hbbs
# Key client: hbbs-data/id_ed25519.pub (sinh lần chạy đầu)
#
# Mật khẩu admin nằm trong file .env cạnh compose, KHÔNG commit:
#   echo "DESKAGENT_ADMIN_PASS=<chuỗi ngẫu nhiên>" > .env
# ================================================================
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: deskagent-hbbs
    # -r QUAN TRỌNG: quảng bá relay đúng bằng IP của HOST chạy Docker
    # (không có -r, hbbs trong container quảng bá IP nội bộ 172.x -> client không relay được)
    command: hbbs -r 192.168.232.129:21117
    ports:
      - "21115:21115/tcp"   # NAT type test
      - "21116:21116/tcp"   # TCP hole punching + ID server
      - "21116:21116/udp"   # ID server / heartbeat (BẮT BUỘC UDP)
      - "21118:21118/tcp"   # websocket (web client)
    volumes:
      - ./hbbs-data:/root
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: deskagent-hbbr
    command: hbbr
    ports:
      - "21117:21117/tcp"   # relay
      - "21119:21119/tcp"   # websocket relay
    volumes:
      - ./hbbr-data:/root
    restart: unless-stopped

  deskagent-manager:
    build: ../manager
    image: deskagent-manager:latest
    container_name: deskagent-manager
    ports:
      - "8080:8080"         # console + API (yêu cầu admin token, xem .env)
    environment:
      # Mật khẩu admin: BẮT BUỘC đặt, nếu không API /api/admin/* sẽ trả 403.
      # Manager từ chối mật khẩu yếu ("admin"/"deskagent"/dưới 8 ký tự).
      - DESKAGENT_ADMIN_USER=${DESKAGENT_ADMIN_USER:-admin}
      - DESKAGENT_ADMIN_PASS=${DESKAGENT_ADMIN_PASS:?set DESKAGENT_ADMIN_PASS in .env}
      # Bot AI: để trống 2 biến DESKAGENT_AI_* thì bot trả lời "chưa cấu hình AI"
      - DESKAGENT_AI_URL=https://api.openai.com/v1
      - DESKAGENT_AI_KEY=
      - DESKAGENT_AI_MODEL=gpt-4o-mini
      # Khuyến nghị chặn cứng host AI được phép gọi (phòng SSRF)
      - DESKAGENT_AI_HOSTS=api.openai.com
    working_dir: /data
    volumes:
      - ./manager-data:/data
    restart: unless-stopped

  # Owned control plane (WS-6): v2 signaling + blind relay + enrollment.
  # Shares manager.db via /shared. Dual-stack with hbbs/hbbr (PROTOCOL_V2_SPEC 8).
  deskagent-control:
    build: ../control-plane
    image: deskagent-control-plane:latest
    container_name: deskagent-control
    ports:
      - "34116:34116/tcp"
      - "34117:34117/tcp"
      - "127.0.0.1:34118:34118/tcp"
    environment:
      - DESKAGENT_CONTROL_DB=/shared/manager.db
      - DESKAGENT_CONTROL_BIND_API=0.0.0.0:34118
      - DESKAGENT_CONTROL_RELAY_ADVERTISE=192.168.232.129:34117
      - DESKAGENT_CONTROL_SIG_ADVERTISE=192.168.232.129:34116
    volumes:
      - ./manager-data:/shared
      - ./control-plane-data:/data
    working_dir: /data
    restart: unless-stopped
